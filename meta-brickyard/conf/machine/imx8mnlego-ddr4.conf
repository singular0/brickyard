#@NAME: imx8mnlego-ddr4
#@DESCRIPTION: Machine config matching the Neato LEGO robot (NXP i.MX8M Nano,
# quad Cortex-A53). Userspace feed only — no kernel/bootloader is built here.
#
# NOTE: Neato built their userspace with the DEFAULT "aarch64" tune (the target
# rootfs packages are arch=aarch64, not cortexa53-crypto), so we do the same.
# That guarantees our ipks match the ABI of everything already installed.

DEFAULTTUNE = "aarch64"
require conf/machine/include/arm/arch-armv8a.inc

MACHINE_FEATURES = ""

# Nothing in the feed should depend on a real kernel, but satisfy the provider
# just in case.
PREFERRED_PROVIDER_virtual/kernel ?= "linux-dummy"
