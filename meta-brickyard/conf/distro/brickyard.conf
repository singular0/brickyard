# Distro for building feed packages ABI-compatible with the Neato LEGO
# firmware (stock poky distro, headless, systemd like the target's
# fsl-imx-xwayland-based "Neato LEGO Distro").
require conf/distro/poky.conf

DISTRO = "brickyard"
DISTRO_NAME = "Brickyard Feed Distro"
DISTRO_VERSION = "1.0"
DISTRO_CODENAME = "zeus"

# The robot is headless; dropping X11 keeps builds small without affecting
# console-tool ABIs. Everything else stays at poky defaults for max
# compatibility with the target rootfs.
DISTRO_FEATURES_DEFAULT_remove = "x11"

# Target uses systemd 243
DISTRO_FEATURES_append = " systemd"
DISTRO_FEATURES_BACKFILL_CONSIDERED = "sysvinit"
VIRTUAL-RUNTIME_init_manager = "systemd"
VIRTUAL-RUNTIME_initscripts = ""
