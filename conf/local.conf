# Feed build configuration for the Neato LEGO robot (imx8mnlego-ddr4, aarch64,
# glibc 2.30, Yocto zeus). See README.md.

MACHINE = "imx8mnlego-ddr4"
DISTRO = "brickyard"

# Target package manager is opkg
PACKAGE_CLASSES = "package_ipk"

# CI runners are disk-constrained; delete workdirs after each recipe
INHERIT += "rm_work"

# Keep the cache outside the build dir so it survives between runs and can be
# synced to object storage. Environment variables (DL_DIR/SSTATE_DIR) win.
# Must be ?= not ??=: bitbake.conf sets its own ?= defaults after including
# this file, and those would beat a weak default.
DL_DIR ?= "${TOPDIR}/../yocto/downloads"
SSTATE_DIR ?= "${TOPDIR}/../yocto/sstate-cache"

BB_NUMBER_THREADS ??= "4"
PARALLEL_MAKE ??= "-j 4"

# Fail early instead of corrupting the cache when the disk fills up
BB_DISKMON_DIRS = "\
    STOPTASKS,${TMPDIR},2G,100K \
    STOPTASKS,${DL_DIR},2G,100K \
    STOPTASKS,${SSTATE_DIR},2G,100K \
    ABORT,${TMPDIR},1G,50K \
    ABORT,${DL_DIR},1G,50K \
    ABORT,${SSTATE_DIR},1G,50K"

CONF_VERSION = "1"
